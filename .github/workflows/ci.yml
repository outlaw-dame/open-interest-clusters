name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify package entrypoint metadata
        run: pnpm verify:package-entrypoints:metadata

      - name: Typecheck
        run: pnpm lint:types

      - name: Build
        run: pnpm build

      - name: Verify package entrypoints
        run: pnpm verify:package-entrypoints

      - name: Package smoke check
        run: pnpm pack --dry-run

      - name: Validate dataset
        run: pnpm validate:dataset

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: test-output.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
