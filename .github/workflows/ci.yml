name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete replace-registry-host || true
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-online true

      - name: Normalize lockfile registry URLs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lockfile = fs.readFileSync(path, 'utf8');
          const normalized = lockfile.replaceAll(
            'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/',
            'https://registry.npmjs.org/'
          );
          fs.writeFileSync(path, normalized);
          NODE

      - name: Install
        run: |
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Typecheck
        run: npm run lint:types

      - name: Build
        run: npm run build

      - name: Validate dataset
        run: npm run validate:dataset

      - name: Run tests
        run: npm test
