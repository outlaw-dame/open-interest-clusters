name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify package entrypoint metadata
        run: pnpm verify:package-entrypoints:metadata

      - name: Typecheck
        run: pnpm lint:types

      - name: Build
        run: pnpm build

      - name: Verify package entrypoints
        run: pnpm verify:package-entrypoints

      - name: Package smoke check
        run: pnpm pack --dry-run

      - name: Validate dataset
        run: pnpm validate:dataset

      - name: Run tests
        run: pnpm test
